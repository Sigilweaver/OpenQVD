[workspace]
resolver = "2"
members = ["crates/openqvd", "crates/openqvd-arrow", "crates/openqvd-py"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Nathan Riley <git@nathanriley.com>"]
repository = "https://github.com/Sigilweaver/OpenQVD"
homepage = "https://sigilweaver.app/openqvd/"
rust-version = "1.88"
keywords = ["qvd", "qlik", "qlikview", "qliksense", "data"]
categories = ["parser-implementations", "encoding"]

[workspace.lints.rust]
unsafe_code = "forbid"
