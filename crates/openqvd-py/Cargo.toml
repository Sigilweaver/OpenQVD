[package]
name = "openqvd-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Python bindings for the OpenQVD library."
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "_openqvd"
crate-type = ["cdylib"]

# Override workspace lint - pyo3 proc-macros generate unsafe code.
[lints.rust]
unsafe_code = "allow"

[dependencies]
openqvd = { version = "2.0.0", path = "../openqvd" }
openqvd-arrow = { version = "2.0.0", path = "../openqvd-arrow", features = ["arrow-60"] }
# One stable wheel per platform: abi3 wheels work on every CPython >= 3.10.
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
# Private to the extension: Arrow never appears in the Python API. Moving to
# a newer Arrow major means changing these three lines and the feature above.
arrow-array = { version = "60", features = ["ffi"] }
arrow-schema = { version = "60", features = ["ffi"] }
