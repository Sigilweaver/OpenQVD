[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "openqvd"
version = "1.2.0"
description = "Clean-room reader/writer for Qlik QVD files - Python bindings"
readme = "../../README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Nathan Riley", email = "git@nathanriley.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: Apache Software License",
]
keywords = ["qvd", "qlik", "qlikview", "qliksense", "arrow", "polars", "pandas"]
dependencies = ["pyarrow>=25.0.0"]

[project.optional-dependencies]
polars = ["polars>=0.19"]
pandas = ["pandas>=1.5", "pyarrow>=25.0.0"]
duckdb = ["duckdb>=1.0", "pyarrow>=25.0.0"]
all = ["openqvd[polars,pandas,duckdb]"]

[project.urls]
Homepage = "https://sigilweaver.app/openqvd"
Repository = "https://github.com/Sigilweaver/OpenQVD"
Changelog = "https://github.com/Sigilweaver/OpenQVD/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "openqvd._openqvd"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
