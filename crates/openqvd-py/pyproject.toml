[build-system]
# Maturin 1.14+ safely relocates parent-relative README and license paths.
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "openqvd"
version = "2.0.0"
description = "Clean-room reader/writer for Qlik QVD files - Python bindings"
readme = "../../README.md"
license = { file = "../../LICENSE" }
authors = [{ name = "Nathan Riley", email = "git@nathanriley.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: Apache Software License",
]
keywords = ["qvd", "qlik", "qlikview", "qliksense", "arrow", "polars", "pandas"]
dependencies = []

[project.optional-dependencies]
pyarrow = ["pyarrow>=15"]
polars = ["polars>=1.10"]
pandas = ["pandas>=2.2", "pyarrow>=15"]
duckdb = ["duckdb>=1.2", "pyarrow>=15"]
all = ["openqvd[pyarrow,polars,pandas,duckdb]"]

[project.urls]
Homepage = "https://sigilweaver.app/openqvd"
Repository = "https://github.com/Sigilweaver/OpenQVD"
Changelog = "https://github.com/Sigilweaver/OpenQVD/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "openqvd._openqvd"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
